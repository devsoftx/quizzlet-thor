# Science Bee 2022–23 Nacional · Final (secundaria) — 33 preguntas.
# Source: docs/Copy of MS Science Bee Finals.pdf
# El texto de las preguntas proviene del documento; las opciones de respuesta incorrectas se agregaron para la opción múltiple.
