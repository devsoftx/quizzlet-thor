title: History Bee · Guía de estudio del Red Set
description: Datos clave de la guía de estudio de historia del Red Set 2026-27.
language: es
enabled: false
shuffle: true
shuffleOptions: true

cards:
  - question: ¿Cómo se llamaba el sistema de segregación racial impuesto en Sudáfrica de 1948 a 1994?
    options: [ Jim Crow, Apartheid, Colonialismo, Feudalismo ]
    answer: Apartheid
    explanation: Las leyes de Jim Crow fueron un sistema de segregación similar en el sur de Estados Unidos.

  - question: ¿En qué idioma la palabra “apartheid” significa “separación”?
    options: [ Afrikáans, Zulú, Suajili, Inglés ]
    answer: Afrikáans

  - question: ¿Qué desierto fue una ruta comercial vital que conectaba el norte de África con el África subsahariana?
    options: [ Desierto de Kalahari, Desierto de Gobi, Desierto de Namib, Desierto del Sahara ]
    answer: Desierto del Sahara
    explanation: Las caravanas de camellos llevaban oro, sal y otras mercancías a través del Sahara.

  - question: En 1953, ¿quién se convirtió en una de las dos primeras personas en llegar a la cima del monte Everest, junto con Edmund Hillary?
    options:
      - George Mallory
      - Reinhold Messner
      - Tenzing Norgay
      - Roald Amundsen
    answer: Tenzing Norgay
    explanation: Tenzing Norgay era un montañista sherpa de Nepal; Hillary era de Nueva Zelanda.

  - question: ¿En qué año Edmund Hillary y Tenzing Norgay llegaron por primera vez a la cima del monte Everest?
    options: [ "1912", "1937", "1953", "1969" ]
    answer: "1953"
    shuffleOptions: false

  - question: La India es la cuna del hinduismo, del jainismo y ¿de qué otra religión?
    options: [ Sijismo, Sintoísmo, Taoísmo, Judaísmo ]
    answer: Sijismo
    explanation: El budismo también nació en la India.

  - question: En 1938, a los dos años, Tenzin Gyatso fue reconocido como el 14.º portador de ¿qué título del budismo tibetano?
    options: [ Panchen Lama, Shogun, Maharajá, Dalái Lama ]
    answer: Dalái Lama

  - question: Angkor Wat, la estructura religiosa más grande del mundo, aparece en la bandera de ¿qué país?
    options: [ Tailandia, Laos, Camboya, Myanmar ]
    answer: Camboya

  - question: ¿Qué clase guerrera japonesa surgió en el siglo X como guardia de ricos terratenientes y desapareció a finales del siglo XIX, cuando Japón modernizó su ejército?
    options: [ Ninjas, Samuráis, Shogunes, Daimios ]
    answer: Samuráis
    explanation: Los shogunes eran gobernantes militares y los daimios eran señores poderosos; los samuráis estaban a su servicio.

  - question: Mesopotamia, parte del Creciente Fértil, se encontraba en las llanuras aluviales de ¿qué dos ríos?
    options:
      - Tigris y Éufrates
      - Nilo y Congo
      - Indo y Ganges
      - Amarillo y Yangtsé
    answer: Tigris y Éufrates
    explanation: Mesopotamia significa “tierra entre ríos”.

  - question: ¿Qué faraón del antiguo Egipto murió en el año 30 a. C., lo que marcó el inicio del dominio romano en Egipto?
    options: [ Tutankamón, Ramsés II, Hatshepsut, Cleopatra ]
    answer: Cleopatra

  - question: Las guerras púnicas enfrentaron a la República romana con ¿qué potencia rival, por el control del Mediterráneo?
    options: [ Persia, Egipto, Cartago, Macedonia ]
    answer: Cartago
    explanation: Cartago era una ciudad del norte de África, en el actual Túnez. Su general Aníbal es famoso por cruzar los Alpes con elefantes de guerra.

  - question: ¿Qué dos casas reales lucharon en la guerra de las Dos Rosas por el trono inglés?
    options:
      - Tudor y Estuardo
      - Lancaster y York
      - Windsor y Hannover
      - Borbón y Habsburgo
    answer: Lancaster y York
    explanation: El símbolo de Lancaster era una rosa roja y el de York, una rosa blanca.

  - question: Cuando Francia abolió su monarquía durante la Revolución francesa, ¿qué rey y qué reina fueron derrocados?
    options:
      - Luis XVI y María Antonieta
      - Luis XIV y María Teresa
      - Enrique VIII y Ana Bolena
      - Fernando e Isabel
    answer: Luis XVI y María Antonieta

  - question: ¿Qué documento, firmado por el rey Juan de Inglaterra en 1215, estableció que el rey no estaba por encima de la ley?
    options:
      - Libro Domesday
      - Carta de Derechos
      - Declaración de Independencia
      - Carta Magna
    answer: Carta Magna
    explanation: Su nombre en latín, Magna Carta, significa “Gran Carta”.

  - question: ¿Qué civilización indígena mesoamericana se extendió por lo que hoy son México, Guatemala, Belice, Honduras y El Salvador?
    options: [ Inca, Azteca, Maya, Olmeca ]
    answer: Maya
    explanation: Los incas vivían en América del Sur, a lo largo de la cordillera de los Andes.

  - question: El Imperio azteca se gobernaba desde ¿qué ciudad, ubicada donde hoy está la Ciudad de México?
    options: [ Cusco, Tenochtitlan, Teotihuacan, Chichén Itzá ]
    answer: Tenochtitlan
    explanation: Cusco era la capital del Imperio inca, en Perú.

  - question: ¿Qué conquistador español dirigió la conquista del Imperio azteca a principios del siglo XVI?
    options:
      - Hernán Cortés
      - Francisco Pizarro
      - Cristóbal Colón
      - Fernando de Magallanes
    answer: Hernán Cortés
    explanation: Francisco Pizarro conquistó el Imperio inca.

  - question: ¿Bajo qué presidente de Estados Unidos se creó el Sistema de Autopistas Interestatales?
    options:
      - Franklin D. Roosevelt
      - Harry S. Truman
      - John F. Kennedy
      - Dwight D. Eisenhower
    answer: Dwight D. Eisenhower

  - question: ¿Qué edificio es la sede del Departamento de Defensa de Estados Unidos?
    options: [ La Casa Blanca, El Capitolio, El Pentágono, Fort Knox ]
    answer: El Pentágono
    explanation: Debe su nombre a su forma de cinco lados.

  - question: ¿Qué presidente puso en marcha el New Deal, con el que creó programas como el Cuerpo Civil de Conservación y la Seguridad Social?
    options:
      - Theodore Roosevelt
      - Franklin D. Roosevelt
      - Herbert Hoover
      - Woodrow Wilson
    answer: Franklin D. Roosevelt

  - question: El asentamiento de Jamestown, en Virginia, tuvo un trato estrecho con ¿qué grupo de nativos americanos, al que pertenecía Pocahontas?
    options:
      - Confederación Powhatan
      - Confederación iroquesa
      - Nación cheroqui
      - Wampanoag
    answer: Confederación Powhatan

  - question: ¿Cómo se llamaba la red secreta de rutas y casas seguras que ayudaba a las personas esclavizadas a escapar hacia la libertad?
    options:
      - Ruta de Oregón
      - Pony Express
      - Sendero de Lágrimas
      - Ferrocarril subterráneo
    answer: Ferrocarril subterráneo
    explanation: Harriet Tubman fue una de sus guías más famosas; a esos guías se les llamaba “conductores”.

  - question: ¿En qué misión de San Antonio el Ejército mexicano venció a los defensores texianos y tejanos tras un sitio de 13 días?
    options: [ Fuerte Sumter, Fuerte McHenry, El Álamo, Little Bighorn ]
    answer: El Álamo
    explanation: “¡Recuerden El Álamo!” se convirtió en un grito de guerra de la Revolución de Texas (1836).

  - question: ¿Qué servicio de correo a caballo conectó Misuri con California de 1860 a 1861?
    options:
      - Ferrocarril transcontinental
      - Pony Express
      - Ruta de Oregón
      - Canal de Erie
    answer: Pony Express
    explanation: Dejó de funcionar cuando el telégrafo pudo enviar mensajes de un extremo a otro del país.

  - question: ¿Qué héroe popular de la Revolución estadounidense hizo una “cabalgata de medianoche” para avisar a las milicias coloniales que se acercaban las tropas británicas?
    options: [ Paul Revere, Benjamin Franklin, Nathan Hale, John Hancock ]
    answer: Paul Revere
