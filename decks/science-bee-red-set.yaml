# National Science Bee 2026-27 — Red Question Set study guide (key facts).
# The guide's 30 "terms for further study" are all covered by the Science Bee practice decks.
# Source: docs/2026-27-Red-Set-Science-Study-Guide (2).pdf

title: Science Bee · Red Set Study Guide
description: Key facts from the 2026-27 Red Set science study guide.
shuffle: true
shuffleOptions: true

cards:
  - question: Which fatal disease, also called hydrophobia, is spread by animal bites and causes frothing at the mouth?
    options: [ Malaria, Rabies, Tetanus, Measles ]
    answer: Rabies

  - question: Which dinosaur was the largest two-legged predator in North America during the Late Cretaceous period?
    options: [ Tyrannosaurus rex, Velociraptor, Stegosaurus, Triceratops ]
    answer: Tyrannosaurus rex
    explanation: Stegosaurus and Triceratops were plant-eaters.

  - question: Which organ of the circulatory system pumps blood throughout the body?
    options: [ Lungs, Liver, Kidneys, Heart ]
    answer: Heart

  - question: Salmonella and E. coli are examples of which one-celled organisms?
    options: [ Viruses, Fungi, Bacteria, Algae ]
    answer: Bacteria
    explanation: Viruses are not made of cells at all.

  - question: Which organ of the digestive system connects the stomach to the colon?
    options: [ Esophagus, Small intestine, Liver, Appendix ]
    answer: Small intestine
    explanation: The esophagus connects your mouth to your stomach.

  - question: What are mammals that carry their young in pouches called?
    options: [ Marsupials, Reptiles, Amphibians, Rodents ]
    answer: Marsupials
    explanation: Kangaroos, koalas and opossums are marsupials.

  - question: How many bones are in the adult human skeleton?
    options: [ "106", "150", "206", "306" ]
    answer: "206"
    explanation: Babies are born with around 300 bones; many fuse together as they grow.
    shuffleOptions: false

  - question: The Jurassic period, when dinosaurs ruled, is the middle part of which era?
    options: [ Paleozoic Era, Cenozoic Era, Mesozoic Era, Precambrian ]
    answer: Mesozoic Era
    explanation: "The Mesozoic has three periods: Triassic, Jurassic and Cretaceous."

  - question: What is the largest planet in the Solar System?
    options: [ Saturn, Jupiter, Neptune, Earth ]
    answer: Jupiter

  - question: Which moon of Jupiter is considered a candidate for having life beyond Earth?
    options: [ Europa, Io, Phobos, Titan ]
    answer: Europa
    explanation: Io is Jupiter's volcanic moon. Phobos orbits Mars and Titan orbits Saturn.

  - question: About how often does Halley's Comet come back into view from Earth?
    options:
      - About every 7 years
      - About every 25 years
      - About every 75 years
      - About every 250 years
    answer: About every 75 years
    explanation: It was last seen in 1986 and is expected back in 2061.
    shuffleOptions: false

  - question: About how fast does light travel in a vacuum?
    options:
      - About 300 km per second
      - About 30,000 km per second
      - About 300,000 km per second
      - About 3,000,000 km per second
    answer: About 300,000 km per second
    explanation: Exactly 299,792,458 meters per second. (The study guide prints 299,492,458 — that's a typo.) Sunlight takes about 8 minutes to reach Earth.
    shuffleOptions: false

  - question: What is the powerful explosion of a star called?
    options: [ Black hole, Supernova, Nebula, Solar eclipse ]
    answer: Supernova
    explanation: Some supernovas happen when a white dwarf star gains too much material and runaway fusion blows it apart.

  - question: Which metal's high malleability and resistance to corrosion make it prized for coins and jewelry?
    options: [ Gold, Iron, Copper, Aluminum ]
    answer: Gold
    explanation: Malleable means it can be hammered into thin sheets without breaking.

  - question: Which property, symbolized by the Greek letter rho (ρ), is the ratio of mass to volume?
    options: [ Velocity, Pressure, Temperature, Density ]
    answer: Density

  - question: Which laboratory device uses natural gas to create a controlled flame?
    options: [ Beaker, Test tube, Bunsen burner, Microscope ]
    answer: Bunsen burner

  - question: Who designed the first periodic table of the elements?
    options: [ Marie Curie, Dmitri Mendeleev, John Dalton, Antoine Lavoisier ]
    answer: Dmitri Mendeleev

  - question: Fluorine, chlorine, bromine and iodine belong to which group of the periodic table?
    options: [ Halogens, Noble gases, Alkali metals, Metalloids ]
    answer: Halogens

  - question: Which element has atomic number 6 and the symbol C, and forms the basis of organic chemistry?
    options: [ Calcium, Chlorine, Copper, Carbon ]
    answer: Carbon
    explanation: Calcium is Ca, chlorine is Cl and copper is Cu.

  - question: What are the smallest square elements of a raster computer image called?
    options: [ Bytes, Vectors, Pixels, Fonts ]
    answer: Pixels
    explanation: '"Pixel" is short for "picture element."'

  - question: Which field of computer science lets machines perform tasks associated with human intelligence?
    options: [ Cybersecurity, Artificial intelligence, Databases, Networking ]
    answer: Artificial intelligence

  - question: Which tall clouds can cause severe thunderstorms and tornadoes?
    options: [ Cumulonimbus, Cirrus, Stratus, Altocumulus ]
    answer: Cumulonimbus

  - question: What fast-moving air currents do airplanes ride to shorten long flights?
    options: [ Trade winds, Monsoons, Sea breezes, Jet streams ]
    answer: Jet streams

  - question: Which form of carbon is the hardest naturally occurring mineral?
    options: [ Graphite, Quartz, Diamond, Coal ]
    answer: Diamond
    explanation: Graphite, the "lead" in pencils, is also pure carbon but very soft. Different forms of one element are called allotropes.

  - question: What are giant ocean waves caused by water displaced in an earthquake or other seismic event?
    options: [ Hurricanes, Tsunamis, Tides, Rip currents ]
    answer: Tsunamis

  - question: What is a chain or cluster of islands, such as Hawaii or the Galápagos, called?
    options: [ Archipelago, Peninsula, Isthmus, Delta ]
    answer: Archipelago

  - question: What usually causes earthquakes?
    options:
      - The phases of the Moon
      - Strong winds
      - Ocean tides
      - Movement of tectonic plates
    answer: Movement of tectonic plates

  - question: Which solid form of precipitation falls from the sky as soft crystals of ice?
    options: [ Hail, Sleet, Snow, Dew ]
    answer: Snow
    explanation: Hail falls as hard balls of ice, and dew isn't precipitation at all.

  - question: What are openings in a planet's surface that let ash and lava escape called?
    options: [ Geysers, Volcanoes, Canyons, Glaciers ]
    answer: Volcanoes

  - question: Why are most plant leaves flat?
    options:
      - To absorb as much sunlight as possible
      - To hold more rainwater
      - To keep insects away
      - To help the plant stay warm
    answer: To absorb as much sunlight as possible
    explanation: Leaves use sunlight to make food through photosynthesis.

  - question: What is a step-by-step procedure that is guaranteed to solve a problem called?
    options: [ Hypothesis, Equation, Theorem, Algorithm ]
    answer: Algorithm

  - question: What do you call a triangle whose three sides all have different lengths?
    options: [ Isosceles, Equilateral, Scalene, Rhombus ]
    answer: Scalene
    explanation: "Equilateral: all three sides equal. Isosceles: two sides equal. A rhombus has four sides."

  - question: Pi (π) is approximately equal to which number?
    options: [ "1.41", "2.72", "3.14", "9.81" ]
    answer: "3.14"
    explanation: "Pi is a transcendental number: its digits go on forever without a repeating pattern."
    shuffleOptions: false

  - question: Which formula gives the area of a circle with radius r?
    options: [ π × r², 2 × π × r, π × d, 4 × r ]
    answer: π × r²
    explanation: 2 × π × r (which equals π × d) gives the circumference — the distance around the circle.

  - question: What is the process by which the unstable nucleus of an atom releases energy?
    options: [ Photosynthesis, Evaporation, Magnetism, Radioactivity ]
    answer: Radioactivity

  - question: Which force resists motion between two surfaces that are touching?
    options: [ Gravity, Magnetism, Friction, Buoyancy ]
    answer: Friction

  - question: What is any object that produces a magnetic field called?
    options: [ Battery, Magnet, Conductor, Insulator ]
    answer: Magnet

  - question: What is the rate of change of an object's velocity called?
    options: [ Acceleration, Speed, Momentum, Mass ]
    answer: Acceleration
